name: Bump Version and Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: bump-version-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require PAT_TOKEN
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [[ -z "$PAT_TOKEN" ]]; then
            echo "Configure a fine-grained PAT_TOKEN repository secret with Contents: Read and write access." >&2
            exit 1
          fi

      - name: Require main branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this workflow from main." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump project version
        env:
          BUMP_TYPE: ${{ inputs.bump }}
        run: |
          git fetch --tags --force
          version="$(npx tsx .github/scripts/bump-manifest-version.ts "$BUMP_TYPE")"
          npm version "$version" --no-git-tag-version --allow-same-version
          tag="v$version"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "ZIP_NAME=allow-copy-$version.zip" >> "$GITHUB_ENV"

      - name: Run checks
        run: npm run check

      - name: Build extension ZIP
        run: |
          npx extension build \
            --browser=chrome \
            --zip \
            --zip-filename="$ZIP_NAME" \
            --no-telemetry

      - name: Commit and tag version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/manifest.json package.json package-lock.json
          git commit -m "chore(release): bump version to $VERSION"
          git tag "$TAG"
          git push origin "HEAD:$GITHUB_REF_NAME"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release create "$TAG" "dist/chrome/$ZIP_NAME" --title "$TAG" --generate-notes
